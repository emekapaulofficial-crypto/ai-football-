<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PredictIQ AI — Admin Login</title><link rel="stylesheet" href="styles.css"></head><body><main class="section" style="max-width:620px;margin:auto"><section class="panel"><div class="step-label">RESTRICTED AREA</div><h1>Admin sign in</h1><p class="muted">Only the designated PredictIQ administrator account can enter this console.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in</button><p id="error" class="status" role="alert"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const c=window.PredictIQSupabase?.client;const form=document.getElementById('loginForm');const error=document.getElementById('error');if(!c){error.textContent='Admin authentication is not configured yet.';return}const ADMIN_EMAIL='pigwe714@gmail.com';const ADMIN_USER_ID='f97b68c0-658e-44b6-bc2b-723bcb74af6b';form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='Signing in…';const submittedEmail=document.getElementById('email').value.trim().toLowerCase();if(submittedEmail!==ADMIN_EMAIL){error.textContent='Access denied. This account is not the administrator.';return}const {data,error:err}=await c.auth.signInWithPassword({email:submittedEmail,password:document.getElementById('password').value});if(err||!data?.user){error.textContent='Invalid administrator credentials or sign-in failed.';return}if(data.user.id!==ADMIN_USER_ID||data.user.email?.toLowerCase()!==ADMIN_EMAIL){await c.auth.signOut();error.textContent='Access denied. This account is not the administrator.';return}location.replace('admin.html')})})()</script></body></html>
