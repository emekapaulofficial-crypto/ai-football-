<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PredictIQ AI — Admin Login</title><link rel="stylesheet" href="styles.css"></head><body><main class="section" style="max-width:620px;margin:auto"><section class="panel"><div class="step-label">RESTRICTED AREA</div><h1>Admin sign in</h1><p class="muted">Only the authenticated PredictIQ administrator account can enter this console.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in</button><p id="error" class="status" role="alert"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.PredictIQSupabase;if(!c?.client){document.getElementById('error').textContent='Admin authentication is not configured yet.'}else document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='Signing in…';const {data,error:err}=await c.client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(err){error.textContent='Invalid admin credentials or sign-in failed.';return}const user=data.user;const role=user?.app_metadata?.role;if(role!=='admin'){await c.client.auth.signOut();error.textContent='Access denied. This account is not an administrator.';return}location.replace('admin.html')});</script></body></html>
